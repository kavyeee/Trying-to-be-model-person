<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#6b1f22;--deep:#4a1417;--cream:#f5efe4;--red:#b8262c;--ink:#3a1b1c}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--wine);color:var(--cream);font-family:'Caveat',cursive;overflow:hidden;
  background-image:radial-gradient(circle at 50% 40%,#7d2629,var(--wine) 70%)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px 90px;opacity:0;pointer-events:none;transition:opacity .6s}
.scene.on{opacity:1;pointer-events:auto}
h1,h2{font-family:'Chonburi',serif;font-weight:400;text-align:center}
h1{font-size:clamp(32px,9vw,64px);margin-bottom:8px}
h2{font-size:clamp(24px,6vw,40px);margin-bottom:18px}
p{font-size:clamp(20px,4.6vw,26px);line-height:1.25}
.hint{opacity:.7;margin-top:18px;font-size:22px}
.polaroid{background:#fff;padding:10px 10px 34px;box-shadow:0 8px 22px #0006;position:relative}
.polaroid .ph{width:100%;aspect-ratio:1;background:#d9c9b8 center/cover;display:grid;place-items:center;color:#8a6f5a;font-size:20px}
.polaroid span{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:var(--ink);font-size:22px}

/* 1 envelope */
.env{position:relative;width:min(80vw,340px);aspect-ratio:1.4;cursor:pointer;transition:transform .3s}
.env:hover{transform:scale(1.03) rotate(-1deg)}
.env .back{position:absolute;inset:0;background:#e9d8bd;border-radius:6px;box-shadow:0 14px 30px #0007}
.env .card{position:absolute;left:8%;right:8%;top:8%;bottom:10%;background:var(--cream);color:var(--ink);
  display:grid;place-items:center;font-size:clamp(34px,10vw,52px);transition:transform .8s;z-index:1}
.env .front{position:absolute;inset:0;z-index:2;background:linear-gradient(135deg,transparent 50%,#f1e2c8 50%) left/50% 100% no-repeat,
  linear-gradient(225deg,transparent 50%,#f1e2c8 50%) right/50% 100% no-repeat;border-radius:6px;
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:#dcc7a5;z-index:3;transform-origin:top;
  clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .7s}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .card{transform:translateY(-45%)}
.seal{position:absolute;z-index:4;left:50%;top:48%;transform:translate(-50%,-50%);font-size:26px;transition:opacity .3s}
.env.open .seal{opacity:0}

/* 2 diary */
.book{display:flex;width:min(92vw,520px);background:var(--cream);color:var(--ink);border-radius:8px;
  box-shadow:0 14px 34px #0008;overflow:hidden;position:relative}
.book .pg{flex:1;padding:22px 18px;min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.book .pg:first-child{border-right:2px solid #0002;background:repeating-linear-gradient(90deg,transparent 0 10px,#0000 10px)}
.age{font-family:'Chonburi',serif;font-size:clamp(60px,18vw,110px);color:var(--red);line-height:1}
.book p{font-size:clamp(18px,4vw,22px)}
.rings{position:absolute;left:50%;top:0;bottom:0;width:0}
.rings i{position:absolute;left:-8px;width:16px;height:6px;border-radius:3px;background:#555}

/* 3 messages */
.msgs{display:grid;gap:22px;width:min(92vw,560px)}
.row{display:flex;gap:16px;align-items:center}
.row .polaroid{width:42%;flex:none}
.row:nth-child(1) .polaroid{transform:rotate(-4deg)}
.row:nth-child(2){flex-direction:row-reverse}
.row:nth-child(2) .polaroid{transform:rotate(3deg)}
.row p{font-size:clamp(17px,3.8vw,21px)}

/* 4 strip */
.strip{display:flex;gap:10px;background:#111;padding:26px 10px;position:relative;max-width:96vw;overflow-x:auto;
  box-shadow:0 12px 30px #0008}
.strip:before,.strip:after{content:"";position:absolute;left:0;right:0;height:10px;
  background:repeating-linear-gradient(90deg,var(--cream) 0 10px,transparent 10px 20px);opacity:.85}
.strip:before{top:7px}.strip:after{bottom:7px}
.frame{flex:none;width:clamp(86px,22vw,140px);aspect-ratio:3/4;background:#444 center/cover;display:grid;place-items:center;color:#aaa;font-size:18px}
.strip-wrap{position:relative}
.strip-wrap .star{position:absolute;right:-10px;top:-18px;font-size:40px;color:#e6b94a}

/* 5 music */
.note{position:relative;width:min(92vw,520px);background:#efe0c4;color:var(--ink);padding:26px 20px;
  border-radius:4px;box-shadow:0 14px 30px #0008;
  -webkit-mask:radial-gradient(circle 8px at 8px 0,#0000 98%,#000) -8px 0/16px 51% repeat-x,radial-gradient(circle 8px at 8px 100%,#0000 98%,#000) -8px 100%/16px 51% repeat-x;
  mask:radial-gradient(circle 8px at 8px 0,#0000 98%,#000) -8px 0/16px 51% repeat-x,radial-gradient(circle 8px at 8px 100%,#0000 98%,#000) -8px 100%/16px 51% repeat-x}
.note p{font-size:clamp(18px,4vw,22px);margin-bottom:16px}
.player{display:flex;align-items:center;gap:14px;background:#222;color:var(--cream);padding:12px 16px;border-radius:12px}
.player button{width:46px;height:46px;border-radius:50%;border:0;background:var(--cream);color:#222;font-size:20px;cursor:pointer}
.reels{display:flex;gap:6px}
.reels b{width:22px;height:22px;border-radius:50%;border:4px solid var(--cream);border-top-color:transparent}
.playing .reels b{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cap{margin-top:20px;max-width:460px;text-align:center}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:18px;padding:18px;z-index:9}
nav button{border:0;background:var(--cream);color:var(--wine);font:inherit;font-size:24px;padding:4px 18px;border-radius:99px;cursor:pointer}
nav button:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:#fff5;transition:.3s}
.dots i.on{background:var(--cream);transform:scale(1.3)}
.confetti{position:fixed;top:-20px;font-size:22px;pointer-events:none;animation:fall linear forwards;z-index:8}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 1. ENVELOPE -->
<section class="scene on">
  <h1 id="title"></h1>
  <div class="env" id="env" role="button" tabindex="0" aria-label="Open the card">
    <div class="back"></div>
    <div class="card" id="cardText"></div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">❤️</div>
  </div>
  <p class="hint" id="hint">tap the envelope</p>
</section>

<!-- 2. DIARY -->
<section class="scene">
  <h2>our diary</h2>
  <div class="book">
    <div class="pg"><div class="age" id="age"></div><p id="diaryText"></p></div>
    <div class="rings"><i style="top:22%"></i><i style="top:50%"></i><i style="top:78%"></i></div>
    <div class="pg"><div class="polaroid" style="width:70%;transform:rotate(3deg)"><div class="ph" data-photo="0">photo</div><span>favorite person</span></div></div>
  </div>
</section>

<!-- 3. MESSAGES -->
<section class="scene">
  <h2>messages &amp; photos</h2>
  <div class="msgs">
    <div class="row"><div class="polaroid"><div class="ph" data-photo="1">photo</div></div><p id="msg1"></p></div>
    <div class="row"><div class="polaroid"><div class="ph" data-photo="2">photo</div></div><p id="msg2"></p></div>
  </div>
</section>

<!-- 4. PHOTOBOOTH -->
<section class="scene">
  <h2>photobooth strip</h2>
  <div class="strip-wrap"><div class="strip" id="strip"></div><div class="star">★</div></div>
  <p class="cap" id="stripText"></p>
</section>

<!-- 5. MUSIC -->
<section class="scene">
  <h2>for you</h2>
  <div class="note">
    <p id="finalText"></p>
    <div class="player" id="player">
      <button id="play" aria-label="Play music">▶</button>
      <div><div id="song">our song</div></div>
      <div class="reels"><b></b><b></b></div>
    </div>
  </div>
</section>

<nav>
  <button id="prev" aria-label="Back">‹</button>
  <div class="dots" id="dots"></div>
  <button id="next" aria-label="Next">›</button>
</nav>

<audio id="audio" loop></audio>

<script>
/* ============ EDIT THIS PART ============ */
const CONFIG = {
  name: "Deeya",
  age: "20",
  songTitle: "our song",
  song: "",                 // e.g. "song.mp3" (file next to this html) or a full URL
  photos: [                 // add up to 4 photo paths/URLs; leave "" for placeholders
    "photo1", "photo3", "photo4", "photo6"
  ],
  envelopeText: "Happy Birthday",
  diary: "Happy Birthday bro! Another year of being you, and somehow you keep making life a little better just by being in it. ♡",
  msg1: "It's kind of funny how a whole year can pass without you even realizing it. There have been so many versions of us packed into these past few months: random plans, stupid jokes, quiet moments, and days that somehow became unforgettable.",
  msg2: "I could keep a little box of everything from this year. It would probably be filled with blurry pictures, ridiculous conversations, tiny surprises, and all the moments that meant more than they seemed at the time. For one, I just want you to enjoy being celebrated today because you absolutely deserve it. ❤️",
  stripText: "Four frames, one very good year.",
  finalText: "And just like that, another little chapter becomes a memory. I hope you always remember how loved you are, not just today, but in all the ordinary moments in between. Whatever comes next, I'm really glad I get to be a part of it."
};
/* ======================================== */

const $ = id => document.getElementById(id);
const scenes = [...document.querySelectorAll('.scene')];
let cur = 0;

// fill text
$('title').textContent = `Happy Birthday, ${CONFIG.name}`;
$('cardText').textContent = CONFIG.envelopeText;
$('age').textContent = CONFIG.age;
$('diaryText').textContent = CONFIG.diary;
$('msg1').textContent = CONFIG.msg1;
$('msg2').textContent = CONFIG.msg2;
$('stripText').textContent = CONFIG.stripText;
$('finalText').textContent = CONFIG.finalText;
$('song').textContent = CONFIG.songTitle;

// photos
document.querySelectorAll('[data-photo]').forEach(el=>{
  const src = CONFIG.photos[+el.dataset.photo];
  if(src){el.style.backgroundImage=`url("${src}")`;el.textContent=''}
});
for(let i=0;i<4;i++){
  const f=document.createElement('div');f.className='frame';
  const src=CONFIG.photos[i];
  if(src){f.style.backgroundImage=`url("${src}")`}else f.textContent='photo';
  f.style.filter='grayscale(.85) contrast(1.1)';
  $('strip').appendChild(f);
}

// nav
scenes.forEach((_,i)=>{const d=document.createElement('i');$('dots').appendChild(d)});
function go(n){
  cur=Math.max(0,Math.min(scenes.length-1,n));
  scenes.forEach((s,i)=>s.classList.toggle('on',i===cur));
  [...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  $('prev').disabled=cur===0;
  $('next').disabled=cur===scenes.length-1||(cur===0&&!opened);
}
$('prev').onclick=()=>go(cur-1);
$('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});

// envelope
let opened=false;
function openEnv(){
  if(opened)return;opened=true;
  $('env').classList.add('open');
  $('hint').textContent='opening…';
  confetti();
  setTimeout(()=>{go(1)},1800);
}
$('env').onclick=openEnv;
$('env').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openEnv()};

// confetti
function confetti(){
  const bits=['🎉','❤️','✨','🎀','🌹'];
  for(let i=0;i<28;i++){
    const c=document.createElement('div');c.className='confetti';
    c.textContent=bits[i%bits.length];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(2+Math.random()*2.5)+'s';
    c.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5500);
  }
}

// music
const audio=$('audio');
if(CONFIG.song)audio.src=CONFIG.song;
$('play').onclick=()=>{
  if(!CONFIG.song){alert('Add your song file in CONFIG.song');return}
  if(audio.paused){audio.play();$('play').textContent='❚❚';$('player').classList.add('playing')}
  else{audio.pause();$('play').textContent='▶';$('player').classList.remove('playing')}
};

go(0);
</script>
</body>
</html>
